<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sound Garden</title>
    <meta name="description" content="Plant flowers in a little garden bed. A breeze sweeps across and plays them as a tune. Share the link and anyone can hear it." />
    <meta name="theme-color" content="#f1eee7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://sound-garden.pages.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sound Garden" />
    <meta property="og:url" content="https://sound-garden.pages.dev/" />
    <meta property="og:title" content="Sound Garden" />
    <meta property="og:description" content="Plant flowers. The breeze plays them. Send the link and they hear your tune." />
    <meta property="og:image" content="https://sound-garden.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A painted garden bed full of tulips, daisies, lavender and mushrooms on a meadow, with a breeze passing over" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sound Garden" />
    <meta name="twitter:description" content="Plant flowers. The breeze plays them." />
    <meta name="twitter:image" content="https://sound-garden.pages.dev/og.png" />
    <meta name="twitter:image:alt" content="A painted garden bed full of tulips, daisies, lavender and mushrooms on a meadow, with a breeze passing over" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="A garden bed of flowers on a painted meadow. Each flower plays a note."></canvas>

    <header class="top">
      <div class="brand">
        <h1>Sound Garden</h1>
        <p>Tap the soil to plant, tap a flower to pull it. Higher rows sing higher.</p>
      </div>
    </header>

    <div class="bottom">
      <div class="pill-bar picker" id="picker" role="radiogroup" aria-label="Flower to plant"></div>
      <div class="pill-bar controls">
        <button type="button" id="btn-play" class="icon-btn play" aria-label="Play the breeze" title="Play (space)">
          <svg class="i-play" viewBox="0 0 20 20" width="18" height="18"><path d="M6.5 4.5v11l9-5.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          <svg class="i-pause" viewBox="0 0 20 20" width="18" height="18"><rect x="5.5" y="4.5" width="3" height="11" rx="1" fill="currentColor"/><rect x="11.5" y="4.5" width="3" height="11" rx="1" fill="currentColor"/></svg>
        </button>
        <span class="sep"></span>
        <div class="tempo" role="group" aria-label="Tempo">
          <button type="button" id="tempo-down" class="icon-btn" aria-label="Slower" title="Slower">
            <svg viewBox="0 0 20 20" width="14" height="14"><path d="M5 10h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <span class="tempo-val" aria-live="polite"><b id="tempo">100</b> bpm</span>
          <button type="button" id="tempo-up" class="icon-btn" aria-label="Faster" title="Faster">
            <svg viewBox="0 0 20 20" width="14" height="14"><path d="M5 10h10M10 5v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <span class="sep"></span>
        <button type="button" id="btn-surprise" class="icon-btn" aria-label="Plant a surprise garden" title="Surprise me">
          <svg viewBox="0 0 20 20" width="17" height="17"><rect x="3.5" y="3.5" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7.3" cy="7.3" r="1.2" fill="currentColor"/><circle cx="12.7" cy="12.7" r="1.2" fill="currentColor"/><circle cx="10" cy="10" r="1.2" fill="currentColor"/></svg>
        </button>
        <button type="button" id="btn-clear" class="icon-btn" aria-label="Clear the bed" title="Clear the bed">
          <svg viewBox="0 0 20 20" width="17" height="17"><path d="M4.5 6h11M8 6V4.5h4V6M6 6l.8 9.5h6.4L14 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="btn-share" class="chip primary">
          <svg viewBox="0 0 20 20" width="15" height="15"><path d="M10 12.5V3.5M6.5 7L10 3.5 13.5 7M5 10.5v5h10v-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Share
        </button>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <div class="start" id="start" role="dialog" aria-modal="true" aria-labelledby="start-title">
      <div class="start-card">
        <p class="eyebrow" id="start-eyebrow" hidden></p>
        <h2 class="hand" id="start-title">Plant a tune</h2>
        <p id="start-text">Every flower is a note. A breeze sweeps the bed and plays them in a loop.</p>
        <button type="button" class="chip primary big" id="start-go">
          <svg viewBox="0 0 20 20" width="15" height="15"><path d="M6.5 4.5v11l9-5.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          <span id="start-label">Start the breeze</span>
        </button>
        <p class="start-note">Turn your sound on, and the silent switch off on iPhone.</p>
      </div>
    </div>

    <div class="shot-title" aria-hidden="true">
      <h1>Sound Garden</h1>
      <p>Plant flowers. The breeze plays them.</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
